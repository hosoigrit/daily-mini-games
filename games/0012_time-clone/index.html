<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>時間の分身</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./src/app.mjs"></script>
</head>
<body>
  <main>
    <header class="masthead">
      <h1>時間の分身</h1>
      <button id="return" type="button" hidden>ステージ一覧</button>
    </header>

    <section id="save-message" aria-label="保存状態" hidden>
      <p id="save-status" role="status"></p>
      <button id="export-save" type="button" hidden>元の保存データを保存</button>
      <button id="reset-save" type="button" hidden>保存データを初期化</button>
    </section>

    <section id="selection" aria-labelledby="stage-heading">
      <p class="intro">足取りを記録し、同じ軌跡をたどる分身と協力してゴールへ。</p>
      <h2 id="stage-heading" tabindex="-1">ステージを選ぶ</h2>
      <ol id="stage-list"></ol>
    </section>

    <section id="game" aria-labelledby="level-title" hidden>
      <div class="stage-header">
        <h2 id="level-title" tabindex="-1"></h2>
        <p id="phase" role="status"></p>
        <button id="show-tutorial" type="button" aria-haspopup="dialog">遊び方</button>
      </div>
      <p id="guide"></p>
      <div id="board" role="img" aria-label="ステージマップ"></div>
      <div class="legend">
        <span><i class="player-key"></i> プレイヤー</span>
        <span><i class="ghost-key"></i> 分身</span>
        <span><i class="goal-key">◎</i> ゴール</span>
      </div>
      <p id="mechanisms" aria-label="仕掛け"></p>

      <div id="timeline" aria-label="記録と再生の進行状況"></div>
      <p id="turn"></p>
      <p id="notice" role="status"></p>

      <div id="controls">
        <div class="actions">
          <button id="primary" class="primary" type="button"></button>
          <button id="retry" type="button" aria-describedby="retry-help" hidden>再挑戦</button>
          <button id="rerecord" type="button" aria-describedby="rerecord-help" hidden>再記録</button>
          <button id="pause" type="button" hidden>一時停止</button>
          <button id="rearm" type="button" hidden>入力状態をリセット</button>
        </div>
        <div id="directions" aria-label="方向操作" hidden>
          <button class="up" type="button" data-direction="U" aria-label="上">↑</button>
          <button class="left" type="button" data-direction="L" aria-label="左">←</button>
          <button class="down" type="button" data-direction="D" aria-label="下">↓</button>
          <button class="right" type="button" data-direction="R" aria-label="右">→</button>
        </div>
      </div>
      <div class="restart-help">
        <p id="retry-help" hidden>再挑戦：今の記録を使って、再生を最初からやり直します。</p>
        <p id="rerecord-help" hidden>再記録：今の記録を破棄して、動きを記録し直します。</p>
      </div>
      <section id="result" aria-labelledby="result-heading" hidden>
        <h3 id="result-heading">クリア</h3>
        <p id="stars"></p>
        <p id="moves"></p>
        <button id="next" type="button" hidden>次のステージ</button>
      </section>
    </section>
  </main>

  <dialog id="tutorial" aria-labelledby="tutorial-title" aria-describedby="tutorial-description tutorial-detail">
    <p id="tutorial-step" class="tutorial-step"></p>
    <h2 id="tutorial-title" tabindex="-1"></h2>
    <p id="tutorial-description"></p>
    <p id="tutorial-detail" class="tutorial-detail"></p>
    <div class="actions tutorial-actions">
      <button id="tutorial-next" class="primary" type="button">次へ</button>
      <button id="tutorial-back" type="button" hidden>戻る</button>
      <button id="tutorial-skip" type="button">スキップ</button>
    </div>
  </dialog>

  <dialog id="confirmation" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-description"></p>
      <div class="actions">
        <button value="cancel" autofocus>キャンセル</button>
        <button id="confirm" class="primary" value="confirm"></button>
      </div>
    </form>
  </dialog>
</body>
</html>
