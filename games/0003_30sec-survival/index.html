<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#07122d">
    <title>30秒サバイバル | Game #0003</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="page-shell">
      <section class="game-card" aria-label="30秒サバイバル">
        <header class="site-header">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <div>
            <p>DAILY MINI GAMES</p>
            <strong>30秒サバイバル</strong>
          </div>
        </header>

        <div class="hud" aria-label="ゲーム状況">
          <div><span>TIME</span><strong><span id="time-value">30.0</span>s</strong></div>
          <div><span>LIFE</span><strong id="lives-value" aria-label="ライフ 3">♥♥♥</strong></div>
          <div><span>ZONE</span><strong id="difficulty-value">EASY</strong></div>
        </div>

        <div id="game-shell" class="game-shell" tabindex="-1">
          <canvas id="game-canvas" aria-label="宇宙船と隕石のゲーム画面"></canvas>
          <div id="game-overlay" class="game-overlay"></div>
        </div>

        <section class="control-zone" aria-label="宇宙船の操作領域">
          <div class="control-copy" aria-hidden="true">
            <span>NAV CONTROL</span>
            <small>DRAG TO MOVE</small>
          </div>
          <div id="joystick" class="joystick" role="application" aria-label="仮想ジョイスティック">
            <div id="joystick-knob" class="joystick-knob"></div>
          </div>
          <p class="keyboard-hint"><kbd>WASD</kbd><br><kbd>↑↓←→</kbd></p>
        </section>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
