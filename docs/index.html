<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daily Mini Games</title>
    <style>
      :root {
        font-family: "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
        color: #17202a;
        background: #eaf1ee;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 720px);
        padding: clamp(24px, 6vw, 48px);
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 20px 60px rgba(35, 55, 48, 0.16);
      }

      h1 {
        margin-top: 0;
      }

      .game-list {
        display: grid;
        gap: 12px;
        padding: 0;
        list-style: none;
      }

      .game-link {
        display: block;
        padding: 18px;
        border: 2px solid #8f1515;
        border-radius: 14px;
        color: #8f1515;
        text-decoration: none;
        font-weight: 700;
      }

      .game-link:hover,
      .game-link:focus-visible {
        color: #fff;
        background: #8f1515;
      }

      .game-title,
      .game-meta {
        display: block;
      }

      .game-meta {
        margin-top: 6px;
        color: #17202a;
        font-size: 0.9rem;
        font-weight: 400;
        line-height: 1.5;
      }

      .game-link:hover .game-meta,
      .game-link:focus-visible .game-meta {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <p>DAILY MINI GAMES</p>
      <h1>毎日1本 Webゲーム</h1>
      <p>公開中のゲームを選んで遊べます。</p>
      <ul class="game-list">
        <li>
          <a class="game-link" href="./games/0001_target-tap/">
            Game 0001：ターゲットタップ
          </a>
        </li>
        <li>
          <a class="game-link" href="./games/0002_light-panels/">
            Game 0002：ひかりのパネル
          </a>
        </li>
        <li>
          <a class="game-link" href="./games/0003_30sec-survival/">
            Game 0003：30秒サバイバル
          </a>
        </li>
        <li>
          <a class="game-link" href="./games/0004_wobbly-tower/">
            Game 0004：ぐらぐらタワー
          </a>
        </li>
        <li>
          <a class="game-link" href="./games/0005_hitofude-delivery/">
            <span class="game-title">Game #0005：ひとふで配達</span>
            <span class="game-meta">ジャンル：パズル・思考型</span>
            <span class="game-meta">荷物をすべて回収してゴールを目指す、一筆書きパズル</span>
            <span class="game-meta">操作：タップ・ドラッグ ／ 対応：PC・スマートフォン</span>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
