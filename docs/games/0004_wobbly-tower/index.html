<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#151331">
    <title>ぐらぐらタワー | Game #0004</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="page-shell">
      <section class="game-card" aria-label="ぐらぐらタワー">
        <header class="game-header">
          <div><span aria-hidden="true">▰</span><strong>ぐらぐらタワー</strong></div>
          <button id="pause-button" class="pause-button" type="button" hidden>一時停止</button>
        </header>
        <section class="hud" aria-label="ゲーム状況">
          <div><span>FLOOR</span><strong id="floor-value">0/10</strong></div>
          <div><span>SCORE</span><strong id="score-value">0</strong></div>
          <div><span>COMBO</span><strong id="combo-value">—</strong></div>
        </section>
        <div class="game-shell">
          <canvas id="game-canvas" width="360" height="560" tabindex="0" aria-label="動くブロックを積み上げるゲーム画面"></canvas>
          <div id="game-overlay" class="game-overlay"></div>
        </div>
        <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
        <p class="input-hint"><kbd>SPACE</kbd> または 画面をタップして落とす</p>
      </section>
    </main>
    <script type="module" src="./src/main.mjs"></script>
  </body>
</html>
